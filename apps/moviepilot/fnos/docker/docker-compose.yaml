services:
  moviepilot:
    image: ${DOCKER_MIRROR}docker.io/jxxghp/moviepilot-v${VERSION_MAJOR}:${VERSION}
    container_name: moviepilot
    ports:
      - "${TRIM_SERVICE_PORT}:3000"
    volumes:
      - ${TRIM_PKGVAR:?}/config:/config
      - ${TRIM_PKGVAR:?}/core:/moviepilot
      # fnOS interpolates wizard values before creating the container.
      - ${wizard_media_dir:-${TRIM_PKGVAR}/media}:/media
      - ${wizard_download_dir:-${TRIM_PKGVAR}/downloads}:/downloads
    environment:
      - TZ=Asia/Shanghai
      - PUID=${TRIM_UID}
      - PGID=${TRIM_GID}
      - UMASK=022
      # v2 架构：NGINX_PORT=Web 入口(须与下方 ports 的容器端口一致)，PORT=后端 API(默认 3001)。
      # 切勿把 PORT 设为 3000，否则会与 nginx 抢端口或导致代理无法命中 Python，登录等 API 会失败。
      - NGINX_PORT=3000
      - PORT=3001
      - GITHUB_PROXY=https://gh-proxy.com/
      - SUPERUSER=admin
      - SUPERUSER_PASSWORD=${wizard_password:-password}
    restart: unless-stopped
