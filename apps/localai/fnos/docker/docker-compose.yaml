services:
  localai:
    # LocalAI dropped the "-cpu" suffix: plain "vX.Y.Z" is the CPU build and
    # "vX.Y.Z-gpu-*" the accelerated ones. "${VERSION}-cpu" tags no longer exist (#288-class).
    image: ${DOCKER_MIRROR}docker.io/localai/localai:v${VERSION}
    container_name: localai
    ports:
      - "${TRIM_SERVICE_PORT}:8080"
    volumes:
      - ${TRIM_PKGVAR:?}/models:/build/models
    environment:
      - TZ=Asia/Shanghai
      - THREADS=4
      - CONTEXT_SIZE=512
    restart: unless-stopped
